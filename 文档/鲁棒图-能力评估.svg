<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}</style>
<text x="750.0" y="50.0" text-anchor="middle" font-size="38" font-weight="700" fill="#183b56"><tspan x="750.0" y="50.0">鲁棒图：登记老人能力评估</tspan></text>
<text x="750.0" y="88.0" text-anchor="middle" font-size="20" font-weight="400" fill="#5e7183"><tspan x="750.0" y="88.0">用例的边界—控制—实体协作</tspan></text>
<line x1="160" y1="410" x2="330" y2="410" stroke="#77899b" stroke-width="3"/><line x1="650" y1="410" x2="790" y2="410" stroke="#77899b" stroke-width="3"/><path d="M1010 375 L1120 220 M1010 410 L1120 410 M1010 445 L1120 600" fill="none" stroke="#77899b" stroke-width="3"/><path d="M790 500 C690 650 520 650 445 510" fill="none" stroke="#4b8297" stroke-width="3" stroke-dasharray="8 7"/><text x="265" y="385.0" text-anchor="middle" font-size="18" font-weight="400" fill="#64798c"><tspan x="265" y="385.0">提交评估</tspan></text><text x="720" y="385.0" text-anchor="middle" font-size="18" font-weight="400" fill="#64798c"><tspan x="720" y="385.0">调用</tspan></text><text x="1065" y="270.0" text-anchor="middle" font-size="17" font-weight="400" fill="#64798c"><tspan x="1065" y="270.0">锁定/校验</tspan></text><text x="1060" y="395.0" text-anchor="middle" font-size="17" font-weight="400" fill="#64798c"><tspan x="1060" y="395.0">写入</tspan></text><text x="1065" y="575.0" text-anchor="middle" font-size="17" font-weight="400" fill="#64798c"><tspan x="1065" y="575.0">复评恢复</tspan></text><text x="610" y="690.0" text-anchor="middle" font-size="18" font-weight="400" fill="#ad5c50"><tspan x="610" y="690.0">校验失败：返回业务错误</tspan></text><g stroke="#4e647a" stroke-width="4" fill="none"><circle cx="135" cy="375" r="17" fill="#ffffff"/><path d="M135 393v44 M111 409h48 M135 437l-24 34 M135 437l24 34"/></g><text x="135" y="503.0" text-anchor="middle" font-size="25" font-weight="600" fill="#2d4359"><tspan x="135" y="503.0">社区管理员</tspan></text><rect x="330" y="315" width="320" height="190" rx="16" fill="#eaf4fb" stroke="#4483a5" stroke-width="4"/><text x="490" y="350.0" text-anchor="middle" font-size="20" font-weight="600" fill="#34718f"><tspan x="490" y="350.0">&lt;&lt;boundary&gt;&gt;</tspan></text><text x="490" y="405.0" text-anchor="middle" font-size="28" font-weight="700" fill="#1d4e69"><tspan x="490" y="405.0">评估录入界面 / API</tspan></text><text x="490" y="455.0" text-anchor="middle" font-size="18" font-weight="400" fill="#42647a"><tspan x="490" y="455.0">接收老人编号、量表、得分、日期</tspan></text><rect x="790" y="315" width="320" height="190" rx="16" fill="#eaf6f2" stroke="#45917d" stroke-width="4"/><text x="950" y="350.0" text-anchor="middle" font-size="20" font-weight="600" fill="#39826d"><tspan x="950" y="350.0">&lt;&lt;control&gt;&gt;</tspan></text><text x="950" y="400.0" text-anchor="middle" font-size="27" font-weight="700" fill="#235e51"><tspan x="950" y="400.0">评估业务控制器</tspan></text><text x="950" y="445.0" text-anchor="middle" font-size="18" font-weight="400" fill="#426f63"><tspan x="950" y="445.0">校验档案与日期、计算等级</tspan></text><text x="950" y="478.0" text-anchor="middle" font-size="18" font-weight="400" fill="#426f63"><tspan x="950" y="478.0">开启事务并提交 / 回滚</tspan></text><rect x="1120" y="150" width="330" height="140" rx="12" fill="#fff8e9" stroke="#b88c3e" stroke-width="3"/><text x="1285" y="192.0" text-anchor="middle" font-size="18" font-weight="600" fill="#9a742f"><tspan x="1285" y="192.0">&lt;&lt;entity&gt;&gt;</tspan></text><text x="1285" y="232.0" text-anchor="middle" font-size="26" font-weight="700" fill="#6e5428"><tspan x="1285" y="232.0">ELDER</tspan></text><text x="1285" y="266.0" text-anchor="middle" font-size="16" font-weight="400" fill="#776442"><tspan x="1285" y="266.0">elder_id · status · community_id</tspan></text><rect x="1120" y="340" width="330" height="140" rx="12" fill="#fff8e9" stroke="#b88c3e" stroke-width="3"/><text x="1285" y="382.0" text-anchor="middle" font-size="18" font-weight="600" fill="#9a742f"><tspan x="1285" y="382.0">&lt;&lt;entity&gt;&gt;</tspan></text><text x="1285" y="422.0" text-anchor="middle" font-size="26" font-weight="700" fill="#6e5428"><tspan x="1285" y="422.0">ASSESSMENT</tspan></text><text x="1285" y="456.0" text-anchor="middle" font-size="16" font-weight="400" fill="#776442"><tspan x="1285" y="456.0">assessment_id · score · ability_level</tspan></text><rect x="1120" y="530" width="330" height="140" rx="12" fill="#fff8e9" stroke="#b88c3e" stroke-width="3"/><text x="1285" y="572.0" text-anchor="middle" font-size="18" font-weight="600" fill="#9a742f"><tspan x="1285" y="572.0">&lt;&lt;entity&gt;&gt;</tspan></text><text x="1285" y="612.0" text-anchor="middle" font-size="26" font-weight="700" fill="#6e5428"><tspan x="1285" y="612.0">CARE_PLAN</tspan></text><text x="1285" y="646.0" text-anchor="middle" font-size="16" font-weight="400" fill="#776442"><tspan x="1285" y="646.0">plan_id · status · elder_id</tspan></text><text x="750" y="770.0" text-anchor="middle" font-size="20" font-weight="400" fill="#526b7d"><tspan x="750" y="770.0">主流程：管理员录入 → 校验老人和评分 → 写入评估；复评时按业务规则恢复暂停计划。</tspan></text><text x="750" y="812.0" text-anchor="middle" font-size="18" font-weight="400" fill="#687f90"><tspan x="750" y="812.0">边界（Boundary）  ·  控制（Control）  ·  实体（Entity）</tspan></text>
</svg>